services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./bun-solution/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"
    networks:
      - rinha

  api1:
    build:
      context: .
      dockerfile: bun-solution/Dockerfile
    environment:
      - PORT=9999
      - DATA_DIR=./data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/ready"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"
    networks:
      - rinha

  api2:
    build:
      context: .
      dockerfile: bun-solution/Dockerfile
    environment:
      - PORT=9999
      - DATA_DIR=./data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/ready"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
