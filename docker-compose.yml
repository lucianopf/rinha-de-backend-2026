services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "16MB"
    networks:
      - rinha

  api1:
    build: .
    environment:
      - PORT=9999
      - DATA_DIR=./data
      - NUM_WORKERS=2
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "167MB"
    networks:
      - rinha

  api2:
    build: .
    environment:
      - PORT=9999
      - DATA_DIR=./data
      - NUM_WORKERS=2
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "167MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
